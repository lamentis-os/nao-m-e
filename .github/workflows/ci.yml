name: CI

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version --verbose

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

  platform:
    name: Rust platform (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            artifact: linux-x86_64
          - name: macOS ARM64
            runner: macos-15
            artifact: macos-arm64
          - name: Windows x86_64
            runner: windows-2025
            artifact: windows-x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version --verbose

      - name: Cache pinned semantic model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nao-m-e-hf-cache
          key: semantic-e5-small-${{ runner.os }}-${{ runner.arch }}-0e60b8d9d2166d80387f86e3b48ec9ced55f4d15

      - name: Check with Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked --no-fail-fast

      - name: Run documentation tests
        run: cargo test --workspace --doc --all-features --locked

      - name: Build release profile
        run: cargo build --workspace --release --all-targets --all-features --locked

      - name: Run release-profile tests
        run: cargo test --workspace --release --all-targets --all-features --locked --no-fail-fast

      - name: Run pinned semantic model twice
        env:
          HF_HUB_CACHE: ${{ runner.temp }}/nao-m-e-hf-cache
        run: >-
          python scripts/check_semantic_fixtures.py run
          --output "${{ runner.temp }}/semantic-fixture-${{ matrix.artifact }}.bin"

      - name: Upload semantic fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-fixture-${{ matrix.artifact }}
          path: ${{ runner.temp }}/semantic-fixture-${{ matrix.artifact }}.bin
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  semantic_compatibility:
    name: Semantic platform compatibility
    needs: platform
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download semantic fixtures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: semantic-fixture-*
          path: ${{ runner.temp }}/semantic-fixtures

      - name: Compare semantic fixtures
        run: >-
          python scripts/check_semantic_fixtures.py compare
          --directory "${{ runner.temp }}/semantic-fixtures"

  required:
    name: Rust CI
    if: ${{ always() }}
    needs:
      - quality
      - platform
      - semantic_compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Verify required jobs
        env:
          PLATFORM_RESULT: ${{ needs.platform.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SEMANTIC_COMPATIBILITY_RESULT: ${{ needs.semantic_compatibility.result }}
        run: |
          if [ "$QUALITY_RESULT" != "success" ] || [ "$PLATFORM_RESULT" != "success" ] || [ "$SEMANTIC_COMPATIBILITY_RESULT" != "success" ]; then
            echo "Required CI jobs did not all succeed."
            echo "quality=$QUALITY_RESULT platform=$PLATFORM_RESULT semantic-compatibility=$SEMANTIC_COMPATIBILITY_RESULT"
            exit 1
          fi
