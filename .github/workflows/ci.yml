name: CI

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version --verbose

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

  platform:
    name: Rust platform (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
          - name: macOS ARM64
            runner: macos-15
          - name: Windows x86_64
            runner: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version --verbose

      - name: Check with Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked --no-fail-fast

      - name: Run documentation tests
        run: cargo test --workspace --doc --all-features --locked

      - name: Build release profile
        run: cargo build --workspace --release --all-targets --all-features --locked

      - name: Run release-profile tests
        run: cargo test --workspace --release --all-targets --all-features --locked --no-fail-fast

  required:
    name: Rust CI
    if: ${{ always() }}
    needs:
      - quality
      - platform
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Verify required jobs
        env:
          PLATFORM_RESULT: ${{ needs.platform.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          if [ "$QUALITY_RESULT" != "success" ] || [ "$PLATFORM_RESULT" != "success" ]; then
            echo "Required CI jobs did not all succeed."
            echo "quality=$QUALITY_RESULT platform=$PLATFORM_RESULT"
            exit 1
          fi
