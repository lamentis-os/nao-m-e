[package]
name = "nao-m-e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A deterministic in-memory memory-atom kernel"
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "nao_m_e"
path = "src/lib.rs"

[dependencies]

[workspace]
members = [
    "crates/nao-m-e-cli",
    "crates/nao-m-e-semantic-index",
    "crates/nao-m-e-sqlite",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/lamentis-os/nao-m-e"
publish = false
