[package]
name = "nao-m-e-cli"
version = "0.0.1"
edition = "2024"
rust-version = "1.95.0"
description = "Command-line interface for the NAO-M-E symbolic memory kernel"
license = "Apache-2.0"
repository = "https://github.com/lamentis-os/nao-m-e"
publish = false

[[bin]]
name = "nao-m-e"
path = "src/main.rs"
doc = false

[dependencies]
nao-m-e = { path = "../.." }
nao-m-e-sqlite = { path = "../nao-m-e-sqlite" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.27.0"
